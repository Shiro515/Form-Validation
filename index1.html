<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Appointment Booking</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    /* ── FORM ── */
    .form-box {
      background: white;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .form-box h2 {
      font-size: 1.8rem;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .form-box p.subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      color: #444;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      font-family: Arial, sans-serif;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #4a90d9;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .error-msg {
      color: #e74c3c;
      font-size: 0.78rem;
      margin-top: 4px;
      display: none;
    }

    .input-error {
      border-color: #e74c3c !important;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #1a1a2e, #4a90d9);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    /* ── CALENDAR ── */
    .calendar-box {
      display: none;
      background: white;
      border-radius: 16px;
      width: 100%;
      max-width: 780px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .calendar-header {
      background: linear-gradient(135deg, #1a1a2e, #4a90d9);
      color: white;
      padding: 24px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .calendar-header h2 {
      font-size: 1.4rem;
    }

    .calendar-header .new-btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .calendar-header .new-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .day-labels {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #f8f9fa;
      border-bottom: 1px solid #eee;
    }

    .day-labels div {
      text-align: center;
      padding: 12px 0;
      font-size: 0.8rem;
      font-weight: bold;
      color: #888;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-left: 1px solid #eee;
      border-top: 1px solid #eee;
    }

    .calendar-cell {
      min-height: 90px;
      border-right: 1px solid #eee;
      border-bottom: 1px solid #eee;
      padding: 8px;
      position: relative;
    }

    .cell-number {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 4px;
    }

    .cell-number.today {
      background: #4a90d9;
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .empty-cell {
      background: #fafafa;
    }

    .appointment-tag {
      background: linear-gradient(135deg, #4a90d9, #1a1a2e);
      color: white;
      border-radius: 4px;
      padding: 4px 7px;
      font-size: 0.72rem;
      margin-top: 2px;
      line-height: 1.4;
    }

    .appointment-tag .tag-time {
      font-size: 0.65rem;
      opacity: 0.85;
    }

    .appointment-tag .tag-title {
      font-weight: bold;
    }

    .appointment-tag .tag-desc {
      opacity: 0.85;
      font-size: 0.65rem;
      margin-top: 1px;
    }
  </style>
</head>
<body>

  <!-- ── FORM ── -->
  <div class="form-box" id="formSection">
    <h2>📅 Book Appointment</h2>
    <p class="subtitle">Fill in the details below to schedule your appointment.</p>

    <div class="form-group">
      <label for="appt-title">Title</label>
      <input type="text" id="appt-title" placeholder="e.g. Doctor Visit" />
      <p class="error-msg" id="err-title">Title is required.</p>
    </div>

    <div class="form-group">
      <label for="appt-date">Date</label>
      <input type="date" id="appt-date" />
      <p class="error-msg" id="err-date">Please select a date.</p>
    </div>

    <div class="form-group">
      <label for="appt-time">Time</label>
      <input type="time" id="appt-time" />
      <p class="error-msg" id="err-time">Please select a time.</p>
    </div>

    <div class="form-group">
      <label for="appt-desc">Description</label>
      <textarea id="appt-desc" placeholder="Add any notes or details..."></textarea>
      <p class="error-msg" id="err-desc">Description is required.</p>
    </div>

    <button class="submit-btn" onclick="submitForm()">Confirm Appointment</button>
  </div>

  <!-- ── CALENDAR ── -->
  <div class="calendar-box" id="calendarSection">
    <div class="calendar-header">
      <h2 id="calendar-title">Month Year</h2>
      <button class="new-btn" onclick="goBack()">+ New Appointment</button>
    </div>

    <div class="day-labels">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <script>
    // Store all appointments
    var appointments = [];

    function submitForm() {
      var title = document.getElementById("appt-title").value.trim();
      var date  = document.getElementById("appt-date").value;
      var time  = document.getElementById("appt-time").value;
      var desc  = document.getElementById("appt-desc").value.trim();

      // Clear previous errors
      clearErrors();

      var hasError = false;

      if (title === "") {
        showError("appt-title", "err-title");
        hasError = true;
      }
      if (date === "") {
        showError("appt-date", "err-date");
        hasError = true;
      }
      if (time === "") {
        showError("appt-time", "err-time");
        hasError = true;
      }
      if (desc === "") {
        showError("appt-desc", "err-desc");
        hasError = true;
      }

      if (hasError) return;

      // Save appointment
      appointments.push({ title: title, date: date, time: time, desc: desc });

      // Show calendar for the selected month
      var parts = date.split("-");
      var year  = parseInt(parts[0]);
      var month = parseInt(parts[1]) - 1; // JS months are 0-based

      buildCalendar(year, month);

      // Hide form, show calendar
      document.getElementById("formSection").style.display = "none";
      document.getElementById("calendarSection").style.display = "block";
    }

    function showError(inputId, errorId) {
      document.getElementById(inputId).classList.add("input-error");
      document.getElementById(errorId).style.display = "block";
    }

    function clearErrors() {
      var inputs = ["appt-title", "appt-date", "appt-time", "appt-desc"];
      var errors = ["err-title", "err-date", "err-time", "err-desc"];

      for (var i = 0; i < inputs.length; i++) {
        document.getElementById(inputs[i]).classList.remove("input-error");
        document.getElementById(errors[i]).style.display = "none";
      }
    }

    function buildCalendar(year, month) {
      var monthNames = ["January","February","March","April","May","June",
                        "July","August","September","October","November","December"];

      document.getElementById("calendar-title").textContent = monthNames[month] + " " + year;

      var grid = document.getElementById("calendarGrid");
      grid.innerHTML = "";

      // What day does the 1st land on? (0=Sun, 6=Sat)
      var firstDay = new Date(year, month, 1).getDay();

      // How many days in this month?
      var daysInMonth = new Date(year, month + 1, 0).getDate();

      // Today's date for highlighting
      var today = new Date();

      // Empty cells before the 1st
      for (var i = 0; i < firstDay; i++) {
        var empty = document.createElement("div");
        empty.className = "calendar-cell empty-cell";
        grid.appendChild(empty);
      }

      // Day cells
      for (var d = 1; d <= daysInMonth; d++) {
        var cell = document.createElement("div");
        cell.className = "calendar-cell";

        // Day number
        var numDiv = document.createElement("div");
        numDiv.className = "cell-number";

        // Highlight today
        if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          numDiv.classList.add("today");
        }

        numDiv.textContent = d;
        cell.appendChild(numDiv);

        // Check if any appointment falls on this day
        for (var a = 0; a < appointments.length; a++) {
          var appt = appointments[a];
          var apptDate = new Date(appt.date + "T00:00:00");

          if (apptDate.getFullYear() === year &&
              apptDate.getMonth()    === month &&
              apptDate.getDate()     === d) {

            var tag = document.createElement("div");
            tag.className = "appointment-tag";
            tag.innerHTML =
              '<div class="tag-time">' + formatTime(appt.time) + '</div>' +
              '<div class="tag-title">' + appt.title + '</div>' +
              '<div class="tag-desc">'  + appt.desc  + '</div>';

            cell.appendChild(tag);
          }
        }

        grid.appendChild(cell);
      }
    }

    // Convert 24hr time to 12hr format
    function formatTime(time) {
      var parts  = time.split(":");
      var hour   = parseInt(parts[0]);
      var minute = parts[1];
      var ampm   = hour >= 12 ? "PM" : "AM";
      hour = hour % 12 || 12;
      return hour + ":" + minute + " " + ampm;
    }

    // Go back to the form to add another appointment
    function goBack() {
      document.getElementById("formSection").style.display = "block";
      document.getElementById("calendarSection").style.display = "none";
      clearErrors();
    }
  </script>

</body>
</html>
